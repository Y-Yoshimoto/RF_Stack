[project]
name = "fastapi-app"
version = "0.1.0"
description = "FastAPIを使ったAPIサーバー"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # FastAPI: Webフレームワーク群
    "fastapi",
    "fastapi-mcp",
    "gunicorn",
    "httpx",
    "uvicorn[standard]",
    "strawberry-graphql[debug-server]",
    # 共通ライブラリ
    "datetime",
    "python-dotenv",
    # データベース関連
    "sqlmodel",
    "psycopg2-binary",
    "alembic",
]
[dependency-groups]
dev = [
    # 開発用ツール群
    "jinja2",
    "lizard",
    "ruff",
    # Pytest: テストツール群
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-html",
    "pytest-check",
    # "pytest-playwright",
]
# コーディング規約: docs/coding-standards/python.md
[tool.ruff]
line-length = 240

[tool.ruff.lint]
# ruff の既定 select は ["E4", "E7", "E9", "F"] で pycodestyle の大半と
# pep8-naming が有効にならないため、明示的に指定する。
#   E/W: pycodestyle, F: pyflakes, N: pep8-naming, I: isort(import順序)
select = ["E", "W", "F", "N", "I"]
ignore = [
    "E402", # E402: Module level import not at top of file
]
