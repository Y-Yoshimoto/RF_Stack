# 実行例
# alembic -c alembic_control_plane.ini revision --autogenerate -m "T_Tenant"
# alembic -c alembic_control_plane.ini upgrade head
# alembic -c alembic_control_plane.ini downgrade head
[alembic]
script_location = %(here)s/control_plane
prepend_sys_path = ./
path_separator = os
# 接続先データベースURL
sqlalchemy.url = postgresql+psycopg2://%(APP_DB_USER)s:%(APP_DB_PASSWORD)s@%(DB_HOST)s:%(DB_PORT)s/%(CONTROL_PLANE_DB_NAME)s

[post_write_hooks]so consumed by the user-maintained

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
