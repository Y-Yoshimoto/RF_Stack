# アプリケーションプレーン DB (APP_DB_NAME) のマイグレーション設定
# 実行例 (fastapi_app ディレクトリで実行)
# uv run alembic -c alembic/alembic_app.ini revision --autogenerate -m "メッセージ"
# uv run alembic -c alembic/alembic_app.ini upgrade head
# uv run alembic -c alembic/alembic_app.ini downgrade -1
[alembic]
script_location = %(here)s/app
prepend_sys_path = ./
path_separator = os
# 接続先は env.py で環境変数から組み立てる (sqlalchemy.url は使わない)
#   APP_DB_OWNER_USER / APP_DB_OWNER_PASSWORD / DB_HOST / DB_PORT / APP_DB_NAME
# 所有者ロール (app_owner) で接続する。ランタイムロールではテーブルを作成できない。

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
