services:
  # React アプリケーション
  react_app:
    image: react_app
    build:
      context: ./react_app
      dockerfile: Dockerfile_dev
      # コンテナ内のユーザーIDとグループIDを指定
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
        APT_CACHE_ID: react_app_apt_cache
    user: vscode
    ports:
      - "4173:4173"
      - "5173:5173"
      - "9323:9323"
      - "6006:6006"
    # restart: always
    environment:
      - TZ=${TZ:-Asia/Tokyo}
      - UID=${USER_ID:-1000}
      - GID=${GROUP_ID:-1000}
      - PLAYWRIGHT_BROWSERS_PATH=${PLAYWRIGHT_BROWSERS_PATH:-/work/react_app/node_modules/playwright/.local-browsers}
    # stdin_open: true
    # 開発用にソースコードをマウント
    volumes:
      - ./:/work/
      # - /tmp/.X11-unix:/tmp/.X11-unix
  # FastAPI アプリケーション
  fastapi_app:
    image: fastapi_app
    build:
      context: ./fastapi_app
      dockerfile: Dockerfile_dev
      args:
        APT_CACHE_ID: fastapi_app_cache
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    # restart: always
    # PYTHONPATH=/work/fastapi_app/src/ が通っているため、モジュール指定は app:app となる
    command: "uvicorn app:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./:/work/
      # Python仮想環境とuvキャッシュは名前付きボリュームに置き、コンテナを作り直しても依存を再インストールしない。
      # 空のボリュームは初回にイメージの内容(所有者はvscode)で初期化される。入れ直す場合は dev-environment スキルを参照
      - fastapi_uv_venv:/usr/local/uv
      - fastapi_uv_cache:/usr/local/uv-cache
    ports:
      - "8000:8000"
    user: vscode
    environment:
      - TZ=${TZ:-Asia/Tokyo}
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONPATH=/work/fastapi_app/src/
      - UID=${USER_ID:-1000}
      - GID=${GROUP_ID:-1000}
      # PlayWrightブラウザインストールディレクトリ(uvの仮想環境は/usr/local/uvに配置)
      - PLAYWRIGHT_BROWSERS_PATH=/usr/local/uv
      # DB接続情報
      - DB_HOST=postgres_c
      - DB_PORT=5432
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      # DBロール接続情報。
      # 開発コンテナではマイグレーションも実行するため owner ロールも渡している。
      # 本番では実行時ロール(*_RUNTIME_* / *_REGISTRY_READER_* / *_CP_AGENT_*)のみを渡し、owner は渡さないこと。
      # コントロールプレーン用ロール
      - CP_DB_OWNER_USER=${CP_DB_OWNER_USER:-cp_owner}
      - CP_DB_OWNER_PASSWORD=${CP_DB_OWNER_PASSWORD:-cp_owner_password}
      - CP_DB_RUNTIME_USER=${CP_DB_RUNTIME_USER:-cp_runtime}
      - CP_DB_RUNTIME_PASSWORD=${CP_DB_RUNTIME_PASSWORD:-cp_runtime_password}
      - CP_DB_REGISTRY_READER_USER=${CP_DB_REGISTRY_READER_USER:-cp_registry_reader}
      - CP_DB_REGISTRY_READER_PASSWORD=${CP_DB_REGISTRY_READER_PASSWORD:-cp_registry_reader_password}
      # アプリケーションプレーン用ロール
      - APP_DB_OWNER_USER=${APP_DB_OWNER_USER:-app_owner}
      - APP_DB_OWNER_PASSWORD=${APP_DB_OWNER_PASSWORD:-app_owner_password}
      - APP_DB_RUNTIME_USER=${APP_DB_RUNTIME_USER:-app_runtime}
      - APP_DB_RUNTIME_PASSWORD=${APP_DB_RUNTIME_PASSWORD:-app_runtime_password}
      - APP_DB_CP_AGENT_USER=${APP_DB_CP_AGENT_USER:-app_cp_agent}
      - APP_DB_CP_AGENT_PASSWORD=${APP_DB_CP_AGENT_PASSWORD:-app_cp_agent_password}
      # データベース名
      - APP_DB_NAME=${APP_DB_NAME:-app_db}
      - CONTROL_PLANE_DB_NAME=${CONTROL_PLANE_DB_NAME:-control_plane_db}
      # KeyCloak認証設定
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://keycloak_c:8080}
      - KEYCLOAK_EXTERNAL_URL=${KEYCLOAK_EXTERNAL_URL:-http://localhost:8080}
      - KEYCLOAK_HTTP_RELATIVE_PATH=${KEYCLOAK_HTTP_RELATIVE_PATH:-keycloak}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-fastapi-app}
      - KEYCLOAK_CP_CLIENT_ID=${KEYCLOAK_CP_CLIENT_ID:-fastapi-cp}
      # クライアントシークレット導出用のシード (開発用の既定値は APP_ENV=development 以外で起動エラー)
      - KC_CLIENT_SECRET_SEED=${KC_CLIENT_SECRET_SEED:-change-me-client-secret-seed}
      - APP_CALLBACK_URL=${APP_CALLBACK_URL:-http://localhost:5173/api/auth/callback}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      # セッション管理
      - APP_ENV=${APP_ENV:-development}
      # 開発用ログインバイパス。APP_ENV=development でのみ有効
      - AUTH_DEV_LOGIN_ENABLED=${AUTH_DEV_LOGIN_ENABLED:-true}
      # 空の場合 CORS は無効(Vite proxy 経由の同一オリジン運用では不要)
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-}
      # CSRF 対策で FRONTEND_URL 以外に許可する Origin (カンマ区切り。空なら FRONTEND_URL のみ)
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
      - REDIS_URL=${REDIS_URL:-redis://redis_c:6379/0}
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY:-change-me-session-secret}
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-3600}
      # Keycloak セットアップ CLI が Admin API を呼ぶための管理者資格情報。開発専用(本番では渡さない)
      - KEYCLOAK_ADMIN_USERNAME=${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      # テナント払い出し用のサービスアカウント(master の cp-provisioner)。APP_ENV=development 以外で使用し、シークレットは必須
      - KEYCLOAK_PROVISIONER_CLIENT_ID=${KEYCLOAK_PROVISIONER_CLIENT_ID:-cp-provisioner}
      - KEYCLOAK_PROVISIONER_CLIENT_SECRET=${KEYCLOAK_PROVISIONER_CLIENT_SECRET:-}
      # 定期ジョブのスケジューラ。空なら APP_ENV=development では無効、それ以外では有効
      - SCHEDULER_ENABLED=${SCHEDULER_ENABLED:-}
    depends_on:
      - postgres_c
      - keycloak_c
      - redis_c
  # PostgreSQL データベース
  postgres_c:
    image: postgres_c
    build: postgres_c
    ports:
      - 5432
    # restart: always
    # user: postgres
    user: postgres
    environment:
      #POSTGRES_USER:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      # initdb で作成する DBロールと DB 名
      # コントロールプレーン用ロール
      - CP_DB_OWNER_USER=${CP_DB_OWNER_USER:-cp_owner}
      - CP_DB_OWNER_PASSWORD=${CP_DB_OWNER_PASSWORD:-cp_owner_password}
      - CP_DB_RUNTIME_USER=${CP_DB_RUNTIME_USER:-cp_runtime}
      - CP_DB_RUNTIME_PASSWORD=${CP_DB_RUNTIME_PASSWORD:-cp_runtime_password}
      - CP_DB_REGISTRY_READER_USER=${CP_DB_REGISTRY_READER_USER:-cp_registry_reader}
      - CP_DB_REGISTRY_READER_PASSWORD=${CP_DB_REGISTRY_READER_PASSWORD:-cp_registry_reader_password}
      # アプリケーションプレーン用ロール
      - APP_DB_OWNER_USER=${APP_DB_OWNER_USER:-app_owner}
      - APP_DB_OWNER_PASSWORD=${APP_DB_OWNER_PASSWORD:-app_owner_password}
      - APP_DB_RUNTIME_USER=${APP_DB_RUNTIME_USER:-app_runtime}
      - APP_DB_RUNTIME_PASSWORD=${APP_DB_RUNTIME_PASSWORD:-app_runtime_password}
      - APP_DB_CP_AGENT_USER=${APP_DB_CP_AGENT_USER:-app_cp_agent}
      - APP_DB_CP_AGENT_PASSWORD=${APP_DB_CP_AGENT_PASSWORD:-app_cp_agent_password}
      # データベース名
      - APP_DB_NAME=${APP_DB_NAME:-app_db}
      - CONTROL_PLANE_DB_NAME=${CONTROL_PLANE_DB_NAME:-control_plane_db}
      - LANG=en_US.UTF-8
      - LANGUAGE=en_US:en
      - LC_ALL=en_US.UTF-8
    # volumes:
    #     - ./db_data/postgres/:/postgres/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Keycloak 認証サーバー
  keycloak_c:
    image: keycloak_c
    build: keycloak_c
    ports:
      - 8080:8080
      - 8443:8443
      - 9000:9000
    volumes:
      - ./db_data/keycloak:/opt/keycloak/data
    environment:
      TZ: ${TZ}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD-admin}
      KC_HTTP_RELATIVE_PATH: ${KC_HTTP_RELATIVE_PATH-keycloak}
      KC_PROXY_HEADER: ${KC_PROXY_HEADER-xforwarded}
      # KC_PROXY: "edge"
      # issuer を固定するために設定する。
      # 未設定だとアクセスされた URL から issuer が決まるため、ブラウザ(外部URL)で発行された
      # トークンをサーバー(内部URL)から使う際に "Invalid token issuer" で拒否される。
      # これを固定することで、トークンのリフレッシュとバックチャネル呼び出しが可能になる。
      KC_HOSTNAME: ${KC_HOSTNAME-http://localhost:8080/keycloak}
    command: "start-dev"
    # command: "start-dev --hostname=http://localhost/keycloak"
    # command: "start --optimized --hostname=localhost"

  # Redis セッションストレージ
  redis_c:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  # fastapi_app の Python 仮想環境(UV_PROJECT_ENVIRONMENT)
  fastapi_uv_venv:
  # fastapi_app の uv キャッシュ(UV_CACHE_DIR)
  fastapi_uv_cache:
