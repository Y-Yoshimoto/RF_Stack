services:
  # React アプリケーション
  react_app:
    image: react_app
    build:
      context: ./react_app
      dockerfile: Dockerfile_dev
      # コンテナ内のユーザーIDとグループIDを指定
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
        APT_CACHE_ID: react_app_apt_cache
    user: vscode
    ports:
      - "5173:5173"
      - "9323:9323"
    # restart: always
    environment:
      - TZ=${TZ:-Asia/Tokyo}
      - UID=${USER_ID:-1000}
      - GID=${GROUP_ID:-1000}
      - PLAYWRIGHT_BROWSERS_PATH=${PLAYWRIGHT_BROWSERS_PATH:-/work/react_app/node_modules/playwright/.local-browsers}
    # stdin_open: true
    # 開発用にソースコードをマウント
    volumes:
      - ./:/work/
      # - /tmp/.X11-unix:/tmp/.X11-unix
  # FastAPI アプリケーション
  fastapi_app:
    image: fastapi_app
    build:
      context: ./fastapi_app
      dockerfile: Dockerfile_dev
      args:
        APT_CACHE_ID: fastapi_app_cache
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    # restart: always
    volumes:
      - ./:/work/
    ports:
      - "8000:8000"
    user: vscode
    environment:
      - TZ=${TZ:-Asia/Tokyo}
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONPATH=/work/fastapi_app/src/
      - UID=${USER_ID:-1000}
      - GID=${GROUP_ID:-1000}
      # PlayWrightブラウザインストールディレクトリ
      - PLAYWRIGHT_BROWSERS_PATH=/work/fastapi_app/.venv
      # DB接続情報
      - DB_HOST=postgres_c
      - DB_PORT=5432
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      # アプリケーション用データベース
      - APP_DB_USER=${APP_DB_USER}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD}
      # コントロールプレーン用データベース
      - CONTROL_PLANE_DB_NAME=${CONTROL_PLANE_DB_NAME}
      # KeyCloak認証設定
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://keycloak_c:8080}
      - KEYCLOAK_EXTERNAL_URL=${KEYCLOAK_EXTERNAL_URL:-http://localhost:8080}
      - KEYCLOAK_HTTP_RELATIVE_PATH=${KEYCLOAK_HTTP_RELATIVE_PATH:-keycloak}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-fastapi-app}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-change-me}
      - APP_CALLBACK_URL=${APP_CALLBACK_URL:-http://localhost:5173/api/auth/callback}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      # セッション管理
      - REDIS_URL=${REDIS_URL:-redis://redis_c:6379/0}
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY:-change-me-session-secret}
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-3600}
    depends_on:
      - postgres_c
      - keycloak_c
      - redis_c
  # PostgreSQL データベース
  postgres_c:
    image: postgres_c
    build: postgres_c
    ports:
      - 5432
    # restart: always
    # user: postgres
    user: postgres
    environment:
      #POSTGRES_USER:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      # アプリケーション/コントロールプレーンユーザー
      - APP_DB_USER=${APP_DB_USER}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD}
      # アプリケーション用データベース
      - APP_DB_NAME=${APP_DB_NAME}
      # コントロールプレーン用データベース
      - CONTROL_PLANE_DB_NAME=${CONTROL_PLANE_DB_NAME}
      - LANG=en_US.UTF-8
      - LANGUAGE=en_US:en
      - LC_ALL=en_US.UTF-8
    # volumes:
    #     - ./db_data/postgres/:/postgres/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Keycloak 認証サーバー
  keycloak_c:
    image: keycloak_c
    build: keycloak_c
    ports:
      - 8080:8080
      - 8443:8443
      - 9000:9000
    volumes:
      - ./db_data/keycloak:/opt/keycloak/data
    environment:
      TZ: ${TZ}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD-admin}
      KC_HTTP_RELATIVE_PATH: ${KC_HTTP_RELATIVE_PATH-keycloak}
      KC_PROXY_HEADER: ${KC_PROXY_HEADER-xforwarded}
      # KC_PROXY: "edge"
      # KC_HOSTNAME: ${KC_HOSTNAME-localhost}
    command: "start-dev"
    # command: "start-dev --hostname=http://localhost/keycloak"
    # command: "start --optimized --hostname=localhost"

  # Redis セッションストレージ
  redis_c:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
