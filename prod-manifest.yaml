kind: Namespace
apiVersion: v1
metadata:
  name: react-app-prod
  labels:
    name: react-app-prod-namespace
---
# Nginx Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-app-prod-nginx-deployment
  namespace: react-app-prod
spec:
  selector:
    matchLabels:
      app: react-app-prod
  replicas: 1
  template:
    metadata:
      labels:
        app: react-app-prod
    spec:
      containers:
        - name: rproxy
          image: rproxy_nginx:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: dist-volumes
              mountPath: /usr/share/nginx/html/dist
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "800m"
        - name: rsync-dist
          image: rsync_dist:latest
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: dist-volumes
              mountPath: /dist
          command: ["tail", "-f", "/dev/null"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
      volumes:
        - name: dist-volumes
          emptyDir: {}
---
# FastAPI and Redis Service
apiVersion: v1
kind: Service
metadata:
  namespace: react-app-prod
  name: react-app-prod-service
spec:
  selector:
    app: react-app-prod
  type: NodePort
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 31080
